<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A16" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Register · Michael's contacts</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%231C2B26"/><text x="16" y="22" font-family="Georgia,serif" font-style="italic" font-size="17" fill="%23ECEFE4" text-anchor="middle">R</text></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #ECEFE4;
    --raised: #F7F9F0;
    --ink: #1C2B26;
    --ink-muted: #5F6E66;
    --rule: rgba(28, 43, 38, 0.16);
    --rule-faint: rgba(28, 43, 38, 0.09);
    --red: #A2372B;
    --red-soft: rgba(162, 55, 43, 0.09);
    --scrim: rgba(28, 43, 38, 0.42);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131A16;
      --raised: #1B241F;
      --ink: #E6EBDD;
      --ink-muted: #93A198;
      --rule: rgba(230, 235, 221, 0.2);
      --rule-faint: rgba(230, 235, 221, 0.1);
      --red: #E07A66;
      --red-soft: rgba(224, 122, 102, 0.13);
      --scrim: rgba(4, 8, 6, 0.6);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .skip-link {
    position: absolute; left: -9999px; top: 8px; z-index: 20;
    background: var(--ink); color: var(--paper);
    padding: 8px 14px; border-radius: 6px; font-size: 13px;
  }
  .skip-link:focus-visible { left: 8px; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 2px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    clip-path: inset(50%); overflow: hidden; white-space: nowrap;
  }

  /* ---------- Gate ---------- */
  #gate[hidden] { display: none; }
  #gate {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .gate-inner { width: min(400px, 100%); text-align: center; }
  .monogram {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
  }
  .gate-inner h1 {
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-size: clamp(44px, 9vw, 58px);
    font-weight: 480;
    letter-spacing: -0.015em;
    margin: 6px 0 4px;
  }
  .gate-tag { color: var(--ink-muted); margin-bottom: 36px; }
  .gate-inner form { text-align: left; }
  .gate-inner label { display: block; margin-bottom: 6px; }
  #token {
    width: 100%;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  #token:focus-visible { outline-offset: 0; }
  .gate-error {
    color: var(--red);
    font-size: 13.5px;
    margin-top: 10px;
    min-height: 1em;
  }
  .gate-open {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    min-height: 48px;
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    color: var(--paper);
    background: var(--ink);
    border-radius: 6px;
  }
  .gate-open:hover { opacity: 0.9; }
  .gate-open[disabled] { opacity: 0.55; cursor: default; }
  .gate-help {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 22px;
    line-height: 1.6;
  }
  .gate-help a { color: inherit; text-underline-offset: 2px; }

  /* ---------- App shell ---------- */
  #app[hidden] { display: none; }
  .shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }
  header.bar {
    position: sticky;
    top: 0;
    z-index: 3;
    background: var(--paper);
    border-bottom: 1px solid var(--rule-faint);
    padding: 14px 0 12px;
  }
  .bar-row { display: flex; align-items: baseline; gap: 14px; }
  .wordmark {
    font-family: var(--serif);
    font-style: italic;
    font-size: 19px;
    font-weight: 500;
    white-space: nowrap;
  }
  .bar-actions { margin-left: auto; display: flex; gap: 4px; }
  .bar-actions button {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 8px 10px;
    min-height: 36px;
    border-radius: 5px;
  }
  .bar-actions button:hover { color: var(--ink); background: var(--rule-faint); }
  #search {
    width: 100%;
    margin-top: 12px;
    padding: 11px 14px;
    font-size: 16px;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: 7px;
  }
  #search::placeholder { color: var(--ink-muted); }

  main { padding-top: 26px; }
  main[aria-busy="true"] { opacity: 0.55; }

  /* ---------- Owed ---------- */
  #owed { margin-bottom: 38px; }
  #owed h2 { margin-bottom: 4px; }
  .owed-row {
    display: grid;
    grid-template-columns: 132px 1fr;
    gap: 4px 16px;
    width: 100%;
    text-align: left;
    padding: 12px 2px;
    min-height: 48px;
    border-bottom: 1px solid var(--rule-faint);
    align-items: baseline;
  }
  .owed-row:hover, .owed-row:active { background: var(--rule-faint); }
  .owed-due { font-family: var(--mono); font-size: 12.5px; color: var(--ink-muted); }
  .owed-due.late { color: var(--red); font-weight: 500; }
  .owed-due.late::after { content: " · late"; }
  .owed-who { font-family: var(--serif); font-size: 16.5px; font-weight: 500; }
  .owed-what { grid-column: 2; color: var(--ink-muted); font-size: 13.5px; }
  .nothing-owed { color: var(--ink-muted); padding: 10px 2px; font-style: italic; font-family: var(--serif); }

  /* ---------- Contact list ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .viewby { margin-left: auto; display: flex; align-items: baseline; gap: 2px; }
  .viewby button {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 8px 9px;
    min-height: 36px;
    border-radius: 5px;
  }
  .viewby button:hover { color: var(--ink); }
  .viewby button[aria-pressed="true"] { color: var(--ink); background: var(--rule-faint); }
  .letter-head {
    scroll-margin-top: 108px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--ink-muted);
    padding: 22px 2px 4px;
    border-bottom: 1px solid var(--rule);
  }
  /* company rows (company view) */
  .company-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 13px 2px;
    min-height: 52px;
    border-bottom: 1px solid var(--rule-faint);
  }
  .company-row:hover, .company-row:active { background: var(--rule-faint); }
  .company-name { font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .company-sub { color: var(--ink-muted); font-size: 13.5px; }
  .company-caret {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .company-row[aria-expanded="true"] .company-caret { color: var(--red); }
  .company-people { padding-left: 14px; border-left: 2px solid var(--rule); margin-left: 2px; }
  .company-people[hidden] { display: none; }

  .avatar {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--paper);
    text-transform: uppercase;
  }
  .card-avatar { width: 46px; height: 46px; font-size: 15px; }

  .person {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    text-align: left;
    padding: 13px 2px;
    min-height: 52px;
    border-bottom: 1px solid var(--rule-faint);
  }
  .person > .person-text { min-width: 0; }
  .person:hover, .person:active { background: var(--rule-faint); }
  .person-name { display: block; font-family: var(--serif); font-size: 17px; font-weight: 500; }
  .person-name .due-mark { color: var(--red); font-style: normal; }
  .person-meta { display: block; color: var(--ink-muted); font-size: 13.5px; margin-top: 1px; }
  .person-snippet {
    display: block;
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 4px;
    font-family: var(--serif);
  }
  .person-snippet mark {
    background: var(--red-soft);
    color: var(--red);
    border-radius: 2px;
    padding: 0 1px;
  }
  .list-empty { color: var(--ink-muted); padding: 24px 2px; font-family: var(--serif); font-style: italic; }

  /* ---------- A–Z rail ---------- */
  #rail[hidden] { display: none; }
  #rail {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    padding: 6px 6px 6px 10px;
    touch-action: none;
    user-select: none;
  }
  #rail button {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink-muted);
    padding: 2.4px 6px 2.4px 8px;
    border-radius: 4px 0 0 4px;
    border-right: 2px solid transparent;
  }
  #rail button[data-has] { color: var(--ink); border-right-color: var(--rule); }
  #rail button[data-has]:hover { color: var(--red); border-right-color: var(--red); }
  #rail button:not([data-has]) { opacity: 0.32; pointer-events: none; }
  @media (max-width: 900px) {
    #rail { padding-left: 4px; }
    .shell { padding-right: 38px; }
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 56px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ---------- Card ---------- */
  #card-scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--scrim);
    display: grid;
    place-items: end center;
    padding: 0;
  }
  #card-scrim[hidden] { display: none; }
  #card {
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--raised);
    border-radius: 14px 14px 0 0;
    padding: 26px 22px 40px;
    border-top: 1px solid var(--rule);
  }
  @media (min-width: 640px) {
    #card-scrim { place-items: center; padding: 32px; }
    #card { width: min(620px, 100%); max-height: 86dvh; border-radius: 12px; padding: 34px 36px 40px; border: 1px solid var(--rule); }
  }
  @media (prefers-reduced-motion: no-preference) {
    #card { animation: rise 190ms cubic-bezier(0.2, 0.7, 0.3, 1); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
  }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .card-name {
    font-family: var(--serif);
    font-size: clamp(26px, 6vw, 32px);
    font-weight: 520;
    letter-spacing: -0.01em;
    line-height: 1.12;
    text-wrap: balance;
  }
  .card-close {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 8px 10px;
    min-height: 40px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .card-close:hover { color: var(--ink); background: var(--rule-faint); }
  .card-role { color: var(--ink-muted); margin-top: 2px; font-size: 14.5px; }
  .card-owed {
    margin-top: 20px;
    padding: 12px 14px;
    border: 1px solid var(--red);
    border-radius: 7px;
    background: var(--red-soft);
    color: var(--red);
  }
  .card-owed .eyebrow { color: var(--red); }
  .card-owed p { font-family: var(--serif); font-size: 15.5px; margin-top: 2px; }
  dl.fields { margin-top: 22px; }
  dl.fields > div {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule-faint);
    align-items: baseline;
  }
  dl.fields dt { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
  dl.fields dd { font-size: 14.5px; overflow-wrap: anywhere; }
  dl.fields dd a { text-underline-offset: 2px; }
  .copyable {
    font: inherit;
    color: inherit;
    text-align: left;
    padding: 2px 6px;
    margin: -2px -6px;
    border-radius: 5px;
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: var(--rule);
  }
  .copyable:hover { background: var(--rule-faint); text-decoration-color: var(--ink-muted); }
  .copyable[data-copied] {
    color: var(--red);
    text-decoration: none;
    background: var(--red-soft);
  }
  .copyable[data-copied="yes"]::after {
    content: " copied";
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .copyable[data-copied="no"]::after {
    content: " press ⌘C";
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    margin: 0 4px 4px 0;
    color: var(--ink-muted);
  }
  .notes { margin-top: 30px; }
  .note-entry { margin-top: 16px; }
  .note-entry p {
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.65;
    margin-top: 4px;
  }
  .note-entry a { color: var(--red); text-underline-offset: 2px; }
  .card-foot { margin-top: 34px; font-size: 12.5px; }
  .card-foot a { color: var(--ink-muted); text-underline-offset: 2px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-inner">
    <div class="monogram" aria-hidden="true">M · G</div>
    <h1>Register</h1>
    <p class="gate-tag">A private book of people.</p>
    <form id="gate-form">
      <label class="eyebrow" for="token">Access key</label>
      <input id="token" name="access-key" type="password" autocomplete="off" spellcheck="false" required>
      <p class="gate-error" id="gate-error" role="alert"></p>
      <button class="gate-open" id="gate-open" type="submit">Open the register</button>
    </form>
    <p class="gate-help">
      Use a fine-grained GitHub token with read-only access to
      <span style="font-family:var(--mono);font-size:12px">personal-crm</span>.
      It is stored only in this browser.
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create one</a>
    </p>
  </div>
</div>

<div id="app" hidden>
  <a class="skip-link" href="#main">Skip to people</a>
  <div class="shell">
    <header class="bar">
      <div class="bar-row">
        <h1 class="wordmark">Register</h1>
        <nav class="bar-actions" aria-label="Register actions">
          <button id="refresh">Refresh</button>
          <button id="lock">Lock</button>
        </nav>
      </div>
      <label class="visually-hidden" for="search">Search people, companies, notes</label>
      <input id="search" name="q" type="search" placeholder="Search people, companies, notes…" autocomplete="off">
    </header>
    <main id="main">
      <section id="owed" aria-label="Follow-ups owed">
        <h2 class="eyebrow">Owed</h2>
        <div id="owed-list"></div>
      </section>
      <section id="contacts" aria-label="Contacts">
        <div class="section-head">
          <h2 class="eyebrow" id="contacts-head" aria-live="polite">People</h2>
          <div class="viewby" role="group" aria-label="Group the list by">
            <span class="eyebrow" aria-hidden="true">View</span>
            <button data-view="company" aria-pressed="true">Company</button>
            <button data-view="name" aria-pressed="false">Name</button>
          </div>
        </div>
        <div id="contact-list"></div>
      </section>
      <footer id="foot"></footer>
    </main>
  </div>
  <nav id="rail" aria-label="Jump to letter"></nav>
</div>

<div id="card-scrim" hidden>
  <article id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" tabindex="-1"></article>
</div>

<noscript><p style="padding:24px;text-align:center">The register needs JavaScript to open.</p></noscript>

<script>
(() => {
  "use strict";
  const REPO = "michaelcgreenberg/personal-crm";
  const KEY = "register.pat";
  const VIEW_KEY = "register.view";
  const RAIL_KEYS = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  const $ = (id) => document.getElementById(id);
  const els = {
    gate: $("gate"), gateForm: $("gate-form"), gateError: $("gate-error"),
    gateOpen: $("gate-open"), token: $("token"), app: $("app"), main: $("main"),
    search: $("search"), owed: $("owed"), owedList: $("owed-list"),
    contactsHead: $("contacts-head"), contactList: $("contact-list"),
    rail: $("rail"), foot: $("foot"), scrim: $("card-scrim"), card: $("card"),
    refresh: $("refresh"), lock: $("lock"),
  };
  const state = {
    data: null, query: "", fetchedAt: null, cardOpen: false, lastFocus: null,
    view: localStorage.getItem(VIEW_KEY) === "name" ? "name" : "company",
  };
  // What the list is grouped and sorted by. Falls back to the name when a
  // record has no company, so nobody drops out of the company view.
  const groupOf = (c) => (state.view === "company" ? c.company || c.name : c.name);
  // Which company rows are open. Ephemeral: resets on reload and on view switch.
  const openCompanies = new Set();

  // Monogram avatar. LinkedIn photo URLs expire and cannot be redistributed,
  // so initials stand in until a real image is dropped into the record.
  const AV = ["#5B7B6A", "#8A6A4F", "#5F6E86", "#7A5B6E", "#6B7A4F", "#4F6E73"];
  function avatar(c, cls) {
    const parts = (c.name || "?").split(/\s+/).filter(Boolean);
    const ini = (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).slice(0, 2);
    let h = 0;
    for (const ch of c.name || "") h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return `<span class="avatar ${cls || ""}" style="background:${AV[h % AV.length]}" aria-hidden="true">${esc(ini)}</span>`;
  }
  const today = () => new Date().toISOString().slice(0, 10);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const letterOf = (name) => {
    const c = (name || "#").normalize("NFD").replace(/[\u0300-\u036f]/g, "")[0].toUpperCase();
    return c >= "A" && c <= "Z" ? c : "#";
  };
  // Escape first, then linkify the escaped text (URLs survive escaping intact).
  const richText = (s) =>
    esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,)]/g,
      (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

  /* ---------- Data ---------- */
  async function fetchRegister(token) {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/search.json`, {
      cache: "no-store",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: "application/vnd.github.raw",
        "X-GitHub-Api-Version": "2022-11-28",
      },
    });
    if (res.status === 401 || res.status === 403)
      throw new Error("GitHub refused that key. It needs read access to contents of " + REPO + ".");
    if (res.status === 404)
      throw new Error("Connected, but search.json is missing. Ask Claude to rebuild the index in personal-crm.");
    if (!res.ok) throw new Error("GitHub answered " + res.status + ". Try again in a minute.");
    return res.json();
  }

  async function open(token, { fromGate } = {}) {
    if (fromGate) { els.gateOpen.disabled = true; els.gateOpen.textContent = "Opening…"; }
    els.main.setAttribute("aria-busy", "true");
    try {
      state.data = await fetchRegister(token);
      state.fetchedAt = new Date();
      localStorage.setItem(KEY, token);
      els.gate.hidden = true;
      els.app.hidden = false;
      render();
      document.title = `Register · ${state.data.contacts.length} people`;
    } catch (err) {
      const refused = String(err.message || "").includes("refused");
      if (refused) localStorage.removeItem(KEY);
      const msg = err instanceof TypeError
        ? "Couldn't reach GitHub. Check the connection and try again."
        : err.message;
      if (fromGate || refused || !els.gate.hidden) {
        els.app.hidden = true;
        els.gate.hidden = false;
        els.gateError.textContent = msg;
        els.token.focus();
      } else {
        els.foot.innerHTML = `<span>${esc(msg)}</span>`;
      }
    } finally {
      els.gateOpen.disabled = false;
      els.gateOpen.textContent = "Open the register";
      els.main.removeAttribute("aria-busy");
    }
  }

  /* ---------- Search ---------- */
  const haystack = (c) => [c.name, c.company, c.role, c.tags, c.met, c.follow_up_note, c.notes]
    .join(" ").toLowerCase();
  function matches(c, tokens) {
    const h = c._hay || (c._hay = haystack(c));
    return tokens.every((t) => h.includes(t));
  }
  function snippetFor(c, tokens) {
    const surface = [c.name, c.company, c.role, c.tags].join(" ").toLowerCase();
    const t = tokens.find((t) => !surface.includes(t) && c.notes.toLowerCase().includes(t));
    if (!t) return "";
    const low = c.notes.toLowerCase();
    const i = low.indexOf(t);
    const from = Math.max(0, i - 34);
    const raw = (from > 0 ? "…" : "") +
      c.notes.slice(from, i) + "\u0001" + c.notes.slice(i, i + t.length) + "\u0002" +
      c.notes.slice(i + t.length, i + t.length + 44).replace(/\n+/g, " ") + "…";
    return esc(raw.replace(/\n+/g, " ")).replace("\u0001", "<mark>").replace("\u0002", "</mark>");
  }

  /* ---------- Rendering ---------- */
  function render() {
    const q = state.query.trim().toLowerCase();
    const tokens = q ? q.split(/\s+/) : [];
    const all = state.data.contacts;
    const now = today();

    // Owed
    const owed = all.filter((c) => c.follow_up).sort((a, b) => a.follow_up.localeCompare(b.follow_up));
    els.owed.hidden = !!q;
    els.owedList.innerHTML = owed.length
      ? owed.map((c) => `
          <button class="owed-row" data-open="${esc(c.file)}">
            <span class="owed-due ${c.follow_up <= now ? "late" : ""}">${esc(c.follow_up)}</span>
            <span class="owed-who">${esc(c.name)}</span>
            ${c.follow_up_note ? `<span class="owed-what">${esc(c.follow_up_note)}</span>` : ""}
          </button>`).join("")
      : `<p class="nothing-owed">Nothing owed.</p>`;

    // Contacts
    const shown = (q ? all.filter((c) => matches(c, tokens)) : all.slice())
      .sort((a, b) => groupOf(a).localeCompare(groupOf(b)) || a.name.localeCompare(b.name));
    els.contactsHead.textContent = q ? `Matches (${shown.length})` : `People (${all.length})`;
    if (!shown.length) {
      els.contactList.innerHTML = `<p class="list-empty">${
        all.length ? `No one matches “${esc(state.query.trim())}”.`
                   : "No one here yet. Tell Claude: “log that I met…”"}</p>`;
    } else if (q) {
      els.contactList.innerHTML = shown.map((c) => personRow(c, snippetFor(c, tokens))).join("");
    } else if (state.view === "company") {
      // One row per property; expand to see who is there.
      const groups = new Map();
      for (const c of shown) {
        const k = groupOf(c);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(c);
      }
      let out = "", last = "";
      for (const [company, people] of groups) {
        const L = letterOf(company);
        if (L !== last) { out += `<h3 class="letter-head" id="letter-${L}">${L}</h3>`; last = L; }
        out += companyRow(company, people);
      }
      els.contactList.innerHTML = out;
    } else {
      let out = "", last = "";
      for (const c of shown) {
        const L = letterOf(groupOf(c));
        if (L !== last) { out += `<h3 class="letter-head" id="letter-${L}">${L}</h3>`; last = L; }
        out += personRow(c, "");
      }
      els.contactList.innerHTML = out;
    }

    renderRail(q ? new Set() : new Set(shown.map((c) => letterOf(groupOf(c)))));
    document.querySelectorAll("[data-view]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    const at = state.fetchedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    els.foot.innerHTML = `<span>${all.length} people</span><span aria-hidden="true">·</span><span>as of ${at}</span>`;
  }

  function personRow(c, snippet) {
    return `
      <button class="person" data-open="${esc(c.file)}">
        ${avatar(c)}
        <span class="person-text">
          <span class="person-name">${esc(c.name)}${c.follow_up ? ` <span class="due-mark" title="Follow-up owed" aria-hidden="true">•</span>` : ""}</span>
          <span class="person-meta">${esc([c.company, c.role].filter(Boolean).join(" · "))}</span>
          ${snippet ? `<span class="person-snippet">${snippet}</span>` : ""}
        </span>
      </button>`;
  }

  function companyRow(company, people) {
    // A single contact needs no disclosure — the row opens their card directly.
    if (people.length === 1) {
      const c = people[0];
      return `
        <button class="person" data-open="${esc(c.file)}">
          ${avatar(c)}
          <span class="person-text">
            <span class="person-name">${esc(company)}${c.follow_up ? ` <span class="due-mark" title="Follow-up owed" aria-hidden="true">•</span>` : ""}</span>
            <span class="person-meta">${esc([c.name, c.role].filter(Boolean).join(" · "))}</span>
          </span>
        </button>`;
    }
    const open = openCompanies.has(company);
    const owed = people.filter((c) => c.follow_up).length;
    return `
      <button class="company-row" data-company="${esc(company)}" aria-expanded="${open}">
        <span class="company-name">${esc(company)}${owed ? ` <span class="due-mark" title="${owed} follow-up owed" aria-hidden="true">•</span>` : ""}</span>
        <span class="company-sub">${people.length} people</span>
        <span class="company-caret">${open ? "Hide" : "Show"}</span>
      </button>
      <div class="company-people" ${open ? "" : "hidden"}>
        ${people.map((c) => personRow(c, "")).join("")}
      </div>`;
  }

  function renderRail(present) {
    els.rail.hidden = present.size === 0;
    els.rail.innerHTML = RAIL_KEYS
      .map((L) => `<button ${present.has(L) ? "data-has" : "tabindex=\"-1\" aria-disabled=\"true\""} data-letter="${L}">${L}</button>`)
      .join("");
  }
  function jumpTo(L) {
    const h = document.getElementById("letter-" + L);
    if (h) h.scrollIntoView({ block: "start" });
  }

  /* ---------- Card ---------- */
  function fieldRows(c) {
    const linkify = {
      email: (v) => `<button class="copyable" data-copy="${esc(v)}" title="Copy to clipboard">${esc(v)}</button>`,
      phone: (v) => `<a href="tel:${esc(v.replace(/[^\d+]/g, ""))}">${esc(v)}</a>`,
      linkedin: (v) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/, ""))}</a>`,
      tags: (v) => v.split(",").map((t) => `<span class="tag">${esc(t.trim())}</span>`).join(""),
    };
    return ["met", "email", "phone", "linkedin", "tags"]
      .filter((k) => c[k])
      .map((k) => `<div><dt>${k}</dt><dd>${(linkify[k] || esc)(c[k])}</dd></div>`)
      .join("");
  }
  function noteEntries(notes) {
    const entries = [];
    let cur = null;
    for (const line of notes.split("\n")) {
      if (line.startsWith("### ")) { cur = { date: line.slice(4).trim(), text: [] }; entries.push(cur); }
      else if (line.startsWith("## ")) continue;
      else if (cur) cur.text.push(line);
    }
    if (!entries.length && notes.trim()) entries.push({ date: "", text: notes.split("\n") });
    return entries.map((e) => `
      <div class="note-entry">
        ${e.date ? `<span class="eyebrow">${esc(e.date)}</span>` : ""}
        ${e.text.join("\n").trim().split(/\n{2,}/).filter(Boolean)
          .map((p) => `<p>${richText(p).replace(/\n/g, "<br>")}</p>`).join("")}
      </div>`).join("");
  }

  function openCard(file, viaHistory) {
    const c = state.data.contacts.find((x) => x.file === file);
    if (!c) return;
    state.lastFocus = document.activeElement;
    els.card.innerHTML = `
      <div class="card-top">
        ${avatar(c, "card-avatar")}
        <div>
          <h2 class="card-name" id="card-title">${esc(c.name)}</h2>
          <p class="card-role">${esc([c.role, c.company].filter(Boolean).join(" · "))}</p>
        </div>
        <button class="card-close" data-close>Close</button>
      </div>
      ${c.follow_up ? `
        <div class="card-owed">
          <span class="eyebrow">Owed · ${esc(c.follow_up)}${c.follow_up <= today() ? " · late" : ""}</span>
          ${c.follow_up_note ? `<p>${esc(c.follow_up_note)}</p>` : ""}
        </div>` : ""}
      <dl class="fields">${fieldRows(c)}</dl>
      ${c.notes.trim() ? `<div class="notes"><h3 class="eyebrow">Notes</h3>${noteEntries(c.notes)}</div>` : ""}
      <p class="card-foot"><a href="https://github.com/${REPO}/blob/main/${esc(c.file)}" target="_blank" rel="noopener">Open the file on GitHub ↗</a></p>`;
    els.scrim.hidden = false;
    document.body.style.overflow = "hidden";
    state.cardOpen = true;
    if (!viaHistory) history.pushState({ card: file }, "");
    els.card.focus({ preventScroll: true });
    els.card.scrollTop = 0;
  }
  function closeCard(viaHistory) {
    if (!state.cardOpen) return;
    if (!viaHistory) { history.back(); return; } // popstate handler finishes the job
    state.cardOpen = false;
    els.scrim.hidden = true;
    document.body.style.overflow = "";
    if (state.lastFocus && state.lastFocus.isConnected) state.lastFocus.focus();
  }
  window.addEventListener("popstate", (e) => {
    if (state.cardOpen) closeCard(true);
    else if (e.state && e.state.card && state.data) openCard(e.state.card, true);
  });

  // Clipboard API needs a secure context and a real gesture; fall back to a
  // hidden textarea so the copy still lands, and say so either way.
  async function copyToClipboard(btn) {
    const text = btn.dataset.copy;
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch { /* fall through */ }
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      ta.remove();
    }
    document.querySelectorAll("[data-copied]").forEach((b) => b.removeAttribute("data-copied"));
    btn.setAttribute("data-copied", ok ? "yes" : "no");
    clearTimeout(btn._t);
    btn._t = setTimeout(() => btn.removeAttribute("data-copied"), 1600);
  }

  /* ---------- Events ---------- */
  els.gateForm.addEventListener("submit", (e) => {
    e.preventDefault();
    els.gateError.textContent = "";
    open(els.token.value.trim(), { fromGate: true });
  });
  els.search.addEventListener("input", () => { state.query = els.search.value; render(); });
  document.querySelectorAll("[data-view]").forEach((b) =>
    b.addEventListener("click", () => {
      if (state.view === b.dataset.view) return;
      state.view = b.dataset.view;
      localStorage.setItem(VIEW_KEY, state.view);
      render();
      window.scrollTo({ top: 0 });
    }));
  els.refresh.addEventListener("click", () => open(localStorage.getItem(KEY)));
  els.lock.addEventListener("click", () => { localStorage.removeItem(KEY); location.reload(); });
  document.addEventListener("click", (e) => {
    const copier = e.target.closest("[data-copy]");
    if (copier) { copyToClipboard(copier); return; }
    const toggle = e.target.closest("[data-company]");
    if (toggle) {
      const name = toggle.dataset.company;
      openCompanies.has(name) ? openCompanies.delete(name) : openCompanies.add(name);
      const people = toggle.nextElementSibling;
      const open = openCompanies.has(name);
      people.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
      toggle.querySelector(".company-caret").textContent = open ? "Hide" : "Show";
      return;
    }
    const opener = e.target.closest("[data-open]");
    if (opener) return openCard(opener.dataset.open);
    if (e.target.closest("[data-close]") || e.target === els.scrim) closeCard();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (state.cardOpen) { e.preventDefault(); closeCard(); }
      else if (document.activeElement === els.search && els.search.value) { els.search.value = ""; state.query = ""; render(); }
    }
    if (e.key === "/" && !state.cardOpen && !e.target.closest("input")) {
      e.preventDefault();
      els.search.focus();
    }
    if (e.key === "Tab" && state.cardOpen) { // keep focus inside the dialog
      const f = els.card.querySelectorAll("a[href], button");
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === els.card)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Rail: tap or drag to scrub. Cache the rail's x once per gesture.
  let railX = 0;
  els.rail.addEventListener("pointerdown", (e) => {
    els.rail.setPointerCapture(e.pointerId);
    railX = els.rail.getBoundingClientRect().left + 12;
    railScrub(e);
  });
  els.rail.addEventListener("pointermove", (e) => { if (e.buttons) railScrub(e); });
  function railScrub(e) {
    const b = document.elementFromPoint(railX, e.clientY);
    if (b && b.dataset && b.dataset.has !== undefined) jumpTo(b.dataset.letter);
  }
  els.rail.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const b = e.target.closest("[data-letter]");
      if (b) { e.preventDefault(); jumpTo(b.dataset.letter); }
    }
  });
  els.rail.addEventListener("click", (e) => {
    const b = e.target.closest("[data-letter]");
    if (b && b.dataset.has !== undefined) jumpTo(b.dataset.letter);
  });

  /* ---------- Boot ---------- */
  const saved = localStorage.getItem(KEY);
  if (saved) open(saved);
  else if (matchMedia("(min-width: 640px)").matches) els.token.focus();
})();
</script>
</body>
</html>
